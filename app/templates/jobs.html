{% extends "base.html" %}

{% block title %}任务监控 | GEO 大模型优化工具{% endblock %}

{% block content %}
<section class="topbar compact">
  <div>
    <p class="eyebrow">Async Jobs</p>
    <h1>任务监控</h1>
    <p class="lede">查看异步分析任务的状态、重试次数和创建人。</p>
  </div>
</section>

<section class="panel">
  <div class="panel-heading">
    <h2>任务列表</h2>
    <p>支持观察 queued、running、retrying、completed、failed 状态。</p>
  </div>
  <div id="job-list" class="history-list"></div>
</section>
{% endblock %}
